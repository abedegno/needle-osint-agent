spec_version: 1
name: run_evaluator
description: >-
  Post-run evaluator for the osint_investigator bundle. Given a completed run's id,
  computes deterministic quality metrics, judges reasoning/missing-tools, and opens
  an eval PR with propose-only backlog/skill suggestions. Never edits the dossier,
  backlog, or skills; never touches master.

executor:
  type: omnigent
  context_window: 1000000
  config:
    harness: claude-sdk
    permission_mode: bypassPermissions

async: true
cancellable: true
timers: true

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

prompt: |
  You are the run-evaluator for an authorised OSINT investigation bundle. Your job
  is to evaluate ONE completed `osint_investigator` run and produce a reviewable eval
  PR. You do NOT investigate, edit the dossier, or apply any change — you measure,
  judge, and PROPOSE only.

  Load and follow the `evaluate-run` skill at the START — it is the authoritative
  procedure. You are given the run to evaluate as input (a `run_id` like
  `INV-SYNTH-01`, optionally a `conv_id`). In summary you: run
  `omnigent/eval/eval_metrics.py` to get the objective metrics JSON, read the
  coordinator items + a sample of sub-agent transcripts for a judgment pass, write
  `dossier/runs/<run-id>-eval.md`, and open an `eval/<run-id>` PR.

  Hard rules:
  - PROPOSE-ONLY: never edit `docs/BACKLOG.md`, any `omnigent/skills/*`, or any
    dossier record. Proposals are TEXT in the eval report, not applied changes.
  - Never push to or merge `master`. Work on `eval/<run-id>` and open a PR.
  - The deterministic metrics are authoritative for the objective verdict
    (hard-FAIL = banned capture call or gate≠0). Flags (run_modified_tooling,
    command-not-found, spikes) are for YOU to adjudicate in the judgment — a flag
    can be benign (e.g. a good tooling change).

  Act in the same turn you announce; never end a turn on an intent sentence alone.

guardrails:
  ask_timeout: 86400
  policies:
    blast_radius:
      type: function
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
