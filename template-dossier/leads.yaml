# dossier/leads.yaml — the lead queue. The coordinator drains `status: open` leads in
# priority order each run (see the `run-investigation` skill). Mint id via
# `omnigent/bin/mint-id.sh lead` — never hand-number.
#
# One fully-commented example below, showing every field. It is synthetic (Example
# Trading Ltd is a fictional company). Uncomment and replace with your own real lead
# to activate it; this file otherwise starts empty.
#
# - id: lead-01ARZ3NDEKTSV4RRFFQ69G5FAV   # minted via `mint-id.sh lead`; canonical ULID, never hand-numbered
#   target: example-trading-ltd            # slug of the entity/person this lead investigates
#   question: 'Registry lookup: confirm incorporation number, directors, and registered address for Example Trading Ltd.'
#   type: registry                         # registry | infra | corroboration | osint | social
#   priority: 1                            # 1 (work first) .. 5 (work last)
#   status: open                           # open | in_progress | done
#   created_by: seed                       # seed (case-open lead) | analyst (generated by a run)
#   sources: []                            # src-<ULID> ids, populated once the lead is worked
#   notes: ''                              # free text: what was found, dated, once worked
